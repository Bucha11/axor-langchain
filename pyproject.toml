[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-langchain"
version = "0.6.2"
description = "Governance middleware for LangChain 1.0 agents — powered by axor-core compression engines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["langchain", "langgraph", "agents", "governance", "token-optimization", "axor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Floor raised 0.6 -> 0.9 together with the ceiling: `IntentNormalizer` moved
    # from `axor_core.node.normalizer` to `axor_core.policy.normalizer` in core
    # 0.9.0, and `axor_langchain.normalizer` now imports it from there. The old
    # `axor_core.node.normalizer` resolved fine on 0.6.x, so the previous pin was
    # self-consistent — it is THIS change that needs 0.9 as the floor: the new
    # import does not exist before it. Raising the ceiling required the migration.
    # Measured against an installed 0.12.0: 192 tests pass.
    "axor-core>=0.9,<0.13",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
]

[project.optional-dependencies]
memory    = ["axor-memory-sqlite>=0.3.0,<0.4"]  # cross-session memory
telemetry = ["axor-telemetry>=0.4.0,<0.5"] # anonymous opt-in classifier signals
plane     = ["axor-wrap[plane]>=0.2.2,<0.3"]  # Control-Plane link (AXOR_PLANE_URL)
anthropic = ["langchain-anthropic>=0.3.0"]
openai    = ["langchain-openai>=0.3.0"]
providers = ["langchain-anthropic>=0.3.0", "langchain-openai>=0.3.0"]
dev       = ["pytest>=7.0", "pytest-asyncio"]
# tests/test_telemetry.py auto-skips when axor-telemetry is not installed
# (see pytest.importorskip at the top of that file). Install locally with
# `pip install -e ".[telemetry]" -e "../axor-telemetry"` for full coverage.

[tool.hatch.build.targets.wheel]
packages = ["axor_langchain"]
